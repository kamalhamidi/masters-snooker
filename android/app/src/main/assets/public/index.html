<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Master's Snooker Club</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #0b4d37 0%, #06281e 65%, #03140f 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.3);
      margin-bottom: 20px;
      animation: pulse 2.5s infinite ease-in-out;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #f7d372;
      margin-bottom: 6px;
    }
    p {
      font-size: 0.9rem;
      color: #a3c4b8;
      max-width: 280px;
      line-height: 1.4;
      margin-bottom: 24px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(247, 211, 114, 0.2);
      border-top-color: #f7d372;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <img src="logo masters.png" alt="Master's Snooker" class="logo" onerror="this.style.display='none'" />
  <h1>MASTER'S SNOOKER</h1>
  <p>Connecting to club arena...</p>
  <div class="spinner"></div>

  <script>
    // Fallback redirect if live server configured
    if (window.Capacitor && typeof window.Capacitor.getServerUrl === 'function') {
      const serverUrl = window.Capacitor.getServerUrl();
      if (serverUrl && window.location.href !== serverUrl) {
        window.location.replace(serverUrl);
      }
    }
  </script>
</body>
</html>
